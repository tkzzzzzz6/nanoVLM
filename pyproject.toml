[project]
name = "nanovlm"
version = "0.1.0"
description = "A lightweight pure-PyTorch implementation for training and fine-tuning small Vision-Language Models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "datasets>=3.2.0,<4.0.0",
    "einops>=0.8.0",
    "huggingface-hub>=0.26.0,<2.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pillow>=10.0.0",
    "safetensors>=0.4.3",
    "torch>=2.4.0,<3.0.0",
    "torchvision>=0.19.0,<1.0.0",
    "transformers>=4.49.0,<5.0.0",
    "wandb>=0.18.0",
]

[project.optional-dependencies]
eval = [
    "accelerate>=1.0.0",
    "loguru>=0.7.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]
plot = [
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
